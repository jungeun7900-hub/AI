<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민원서비스 검색</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><p class="eyebrow">민원서비스 안내</p><h1>필요한 민원서비스를 빠르게 찾아보세요</h1><p>서비스명을 검색하거나 민원분야를 선택하면 결과가 즉시 표시됩니다.</p></div></header><main class="wrap"><section class="controls" aria-label="검색 및 필터"><label>서비스명 검색<input id="search" type="search" placeholder="예: 여권, 주민등록, 건축" autocomplete="off"></label><label>민원분야<select id="category"><option value="">전체 분야</option></select></label></section><div class="summary" aria-live="polite">현재 표시 <strong id="count">22</strong>건</div><section id="list" class="grid" aria-label="민원서비스 목록"></section><p id="empty" class="empty" hidden>조건에 맞는 민원서비스가 없습니다.</p></main><footer>민원서비스 검색·필터 안내 페이지</footer><script src="app.js"></script></body></html>
